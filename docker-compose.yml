volumes:
  nuxtshop_production_db:

services:
  nuxtshop:
    depends_on:
      - db
    image: docker.io/wuttinanhi/nuxtshop:latest
    # build:
    #   context: .
    #   dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    cpu_shares: 512
    deploy:
      resources:
        # Maximum
        limits:
          memory: 512M
          cpus: "0.5"
        # Minimum
        reservations:
          memory: 256M
          cpus: "0.5"

  db:
    image: postgres:18.1
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: mynuxtshop
      POSTGRES_USER: mynuxtshop
      POSTGRES_DB: mynuxtshop
    volumes:
      - nuxtshop_production_db:/var/lib/postgresql
    ports:
      - "5432:5432"
    cpu_shares: 1024
    deploy:
      resources:
        # Maximum
        limits:
          memory: 1024M
          cpus: "1.0"
        # Minimum
        reservations:
          memory: 512M
          cpus: "0.5"

  adminer:
    depends_on:
      - db
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    cpu_shares: 256
    deploy:
      resources:
        # Maximum
        limits:
          memory: 256M
          cpus: "0.5"
        # Minimum
        reservations:
          memory: 128M
          cpus: "0.5"
